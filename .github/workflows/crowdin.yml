name: Crowdin

on:
  push:
    branches: [main]
    paths:
      - TMessagesProj/src/main/res/values/bygram_strings.xml
      - crowdin.yml
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_sources_args: --cache
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download:
    needs: upload
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.upload.result == 'success' || needs.upload.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crowdin/github-action@v3
        with:
          upload_sources: false
          download_translations: true
          export_only_approved: true
          skip_untranslated_strings: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: 'Обновление переводов Crowdin'
          pull_request_base_branch_name: main
          user: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
